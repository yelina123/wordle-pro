function $(id){ return document.getElementById(id); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

function init(){
  DICT5_S = " " + DICT5 + " ";
  DICT6_S = " " + DICT6 + " ";
  loadCfg();
  parseBank();
  showSetup(false);
  if (window.addEventListener){ window.addEventListener("resize", onResize, false); }
}

function onResize(){
  if (resizeTimer) { clearTimeout(resizeTimer); }
  resizeTimer = setTimeout(function(){ render(); }, 180);
}

function render(){
  if (screen == "setup") { renderSetup(); }
  else if (screen == "game") { renderGame(); }
  else if (screen == "alpha") { renderAlpha(); }
  else if (screen == "confirm") { renderConfirm(); }
}

/* ---------- 数据与设置 ---------- */

function addBank(raw){
  var a = raw.split(";"), i, p;
  for (i = 0; i < a.length; i++){
    if (!a[i]) { continue; }
    p = a[i].split("|");
    if (p.length < 4) { continue; }
    BANK.push({w:p[0], g:p[1], lv:p[2], fm:p[3]});
  }
}

function parseBank(){
  addBank(RAW5);
  addBank(RAW6);
}

function loadCfg(){
  var s = "", p;
  try { s = window.localStorage.getItem("wordle_kindle") || ""; } catch (e) { s = ""; }
  if (!s) { return; }
  p = s.split("|");
  if (p.length >= 6){
    cfg.len = (p[0] == "6") ? 6 : 5;
    cfg.tries = parseInt(p[1], 10);
    cfg.level = (p[2] == "h") ? "h" : "e";
    cfg.filter = (p[3] == "0") ? 0 : 1;
    cfg.played = parseInt(p[4], 10) || 0;
    cfg.wins = parseInt(p[5], 10) || 0;
  }
  if (cfg.len != 5 && cfg.len != 6) { cfg.len = 5; }
  if (!(cfg.tries >= 4 && cfg.tries <= 8)) { cfg.tries = 6; }
}

function saveCfg(){
  var s = cfg.len + "|" + cfg.tries + "|" + cfg.level + "|" + cfg.filter + "|" + cfg.played + "|" + cfg.wins;
  try { window.localStorage.setItem("wordle_kindle", s); } catch (e) {}
}

function setOpt(k, v){
  if (k == "tries") { cfg.tries = v; }
  else if (k == "len") { cfg.len = v; }
  else if (k == "level") { cfg.level = v; }
  else if (k == "filter") { cfg.filter = v; }
  saveCfg();
  renderSetup();
}

/* ---------- 尺寸计算 ---------- */

function baseMetrics(){
  var de = document.documentElement;
  var W = de.clientWidth || window.innerWidth || 600;
  var H = de.clientHeight || window.innerHeight || 800;
  var m = Math.max(6, Math.round(Math.min(W, H) * 0.02));
  var wide = (W >= 740 && W > H * 1.15);
  var appW = Math.min(W - 2 * m, wide ? 1280 : 760);
  M = {
    W:W, H:H, m:m, wide:wide,
    appW:appW,
    appH:H - 2 * m,
    headerH: clamp(Math.round(H * 0.07), 44, 60),
    statusH: clamp(Math.round(H * 0.038), 24, 34),
    actionH: clamp(Math.round(H * 0.075), 48, 62),
    keyH: clamp(Math.round(H * 0.058), 42, 56),
    gap: Math.max(4, Math.round(H * 0.007))
  };
}

function gameMetrics(rows, cols){
  baseMetrics();
  var padGap = Math.max(3, Math.round(M.keyH * 0.1));
  var padH = 3 * M.keyH + 4 * padGap;
  M.padGap = padGap;
  M.padH = padH;
  if (M.wide){
    var rightW = Math.min(520, Math.round(M.appW * 0.44));
    var leftW = M.appW - rightW - 2 * M.gap;
    var bh = M.appH - M.headerH - 2 * M.gap;
    var cw = (leftW - (cols + 1) * M.gap) / cols;
    var ch = (bh - (rows + 1) * M.gap) / rows;
    M.cell = Math.min(cw, ch, 118);
    M.rightW = rightW; M.leftW = leftW; M.padW = rightW; M.boardW = leftW;
  } else {
    var bh2 = M.appH - M.headerH - M.statusH - M.actionH - padH - 4 * M.gap;
    var cw2 = (M.appW - (cols + 1) * M.gap) / cols;
    var ch2 = (bh2 - (rows + 1) * M.gap) / rows;
    M.cell = Math.min(cw2, ch2, 96);
    M.padW = M.appW;
    M.boardW = M.appW;
  }
  M.cell = Math.max(20, Math.floor(M.cell));
  M.keyW = Math.max(20, Math.floor((M.padW - 11 * M.padGap) / 10));
  M.boardH = rows * M.cell + (rows + 1) * M.gap;
  M.boardTableW = cols * M.cell + (cols + 1) * M.gap;
}

/* ---------- 通用片段 ---------- */

function topbar(mode){
  var tw = (mode == "setup") ? Math.min(M.appW, 900) : M.appW;
  var h = '<table class="topbar" style="width:' + tw + 'px;height:' + M.headerH + 'px;table-layout:fixed;border-collapse:collapse;margin:0 auto;"><tr>';
  h += '<td style="height:' + M.headerH + 'px;vertical-align:middle;text-align:left;white-space:nowrap">';
  h += '<span class="brand" style="font-size:' + Math.round(M.headerH * 0.44) + 'px">WORDLE</span>';
  h += '<span class="sub" style="font-size:' + Math.round(M.headerH * 0.22) + 'px;margin-left:7px">5/6 字母</span>';
  h += '</td><td style="height:' + M.headerH + 'px;vertical-align:middle;text-align:right;white-space:nowrap">';
  var bh = Math.round(clamp(M.headerH * 0.72, 36, 48));
  var fs = Math.round(clamp(M.headerH * 0.29, 14, 19));
  if (mode == "game"){
    h += '<button class="tbtn" style="height:' + bh + 'px;font-size:' + fs + 'px" onclick="showSetup(true)">设置</button>';
    h += '<button class="tbtn primary" style="height:' + bh + 'px;font-size:' + fs + 'px" onclick="newGameTap()">新一局</button>';
  } else if (mode == "alpha"){
    h += '<button class="tbtn" style="height:' + bh + 'px;font-size:' + fs + 'px" onclick="closeAlpha()">返回游戏</button>';
  } else if (mode == "setup" && setupFrom == "mid"){
    h += '<button class="tbtn" style="height:' + bh + 'px;font-size:' + fs + 'px" onclick="showGame()">返回本局</button>';
  } else if (mode == "confirm"){
    h += '<button class="tbtn" style="height:' + bh + 'px;font-size:' + fs + 'px" onclick="showGame()">返回本局</button>';
  }
  h += '</td></tr></table>';
  h += '<div style="height:2px;background:#000000;width:' + tw + 'px;margin:0 auto"></div>';
  return h;
}

function statusHtml(){
  var label = (game.level == "e" ? "简单档" : "难档") + " · " + game.len + " 字母";
  var right;
  if (game.phase == "play"){
    right = "剩余 " + (game.maxTries - game.rows.length) + " 次";
  } else if (game.phase == "bonus"){
    right = "剩余 0 次";
  } else {
    right = game.won ? "本局猜中" : "本局结束";
  }
  var fs = Math.round(clamp(M.statusH * 0.52, 12, 17));
  return '<div class="status" style="height:' + M.statusH + 'px;line-height:' + M.statusH + 'px;font-size:' + fs + 'px">'
    + '<span class="l">' + label + '</span>'
    + '<span class="m" id="msg">' + (game.msg ? "· " + game.msg : "") + '</span>'
    + '<span class="r">' + right + '</span>'
    + '</div>';
}

function boardHtml(){
  var cols = game.len, rows = game.maxTries, c = M.cell, g = M.gap, inner = c - 4;
  var h = '<table style="border-collapse:separate;border-spacing:' + g + 'px;table-layout:fixed;width:' + M.boardTableW + 'px;margin:0 auto;">';
  var r, k, cls, ch;
  for (r = 0; r < rows; r++){
    h += "<tr>";
    for (k = 0; k < cols; k++){
      cls = "cell"; ch = "";
      if (r < game.rows.length){
        ch = game.rows[r].charAt(k).toUpperCase();
        cls = "cell s" + game.marks[r][k];
      } else if (r == game.rows.length && game.phase == "play"){
        cls = "cell on";
        if (k < game.cur.length) { ch = game.cur.charAt(k); }
      }
      h += '<td id="c' + r + '_' + k + '" class="' + cls + '" style="width:' + inner + 'px;height:' + inner + 'px;line-height:' + inner + 'px;font-size:' + Math.round(c * 0.48) + 'px">' + ch + '</td>';
    }
    h += "</tr>";
  }
  h += "</table>";
  return h;
}

function padHtml(){
  var h = "", r, c, row, ch, w, kw = M.keyW, kh = M.keyH, pg = M.padGap;
  var fs = Math.round(clamp(kh * 0.48, 14, 26));
  for (r = 0; r < PAD_ROWS.length; r++){
    row = PAD_ROWS[r];
    w = row.length * kw + (row.length + 1) * pg;
    h += '<table style="border-collapse:separate;border-spacing:' + pg + 'px;table-layout:fixed;width:' + w + 'px;margin:0 auto;">';
    h += "<tr>";
    for (c = 0; c < row.length; c++){
      ch = row.charAt(c);
      h += '<td class="key' + keyCls(ch) + '" id="k' + ch + '" onclick="tapLetter(&quot;' + ch + '&quot;)" style="width:' + (kw - 2) + 'px;height:' + (kh - 2) + 'px;line-height:' + (kh - 2) + 'px;font-size:' + fs + 'px">' + ch + '</td>';
    }
    h += "</tr></table>";
  }
  return h;
}

function keyCls(ch){
  var st = game.status[ch];
  if (st == 2) { return " k2"; }
  if (st == 1) { return " k1"; }
  if (st == -1) { return " k0"; }
  return "";
}

function gridRow(width, items, height, gap, cls){
  var n = items.length, cw = Math.floor(width / n), i;
  var fs = Math.round(clamp(height * 0.33, 14, 22));
  var h = '<table style="width:' + (cw * n) + 'px;table-layout:fixed;border-collapse:collapse"><tr>';
  for (i = 0; i < n; i++){
    var pad = (i > 0) ? gap : 0;
    h += '<td style="width:' + (cw - pad) + 'px;padding:0 0 0 ' + pad + 'px;vertical-align:top">';
    h += '<button class="' + cls + (items[i].on ? ' on' : '') + '" style="width:' + (cw - pad - 4) + 'px;height:' + (height - 4) + 'px;font-size:' + (items[i].fs || fs) + 'px" onclick="' + items[i].call + '">' + items[i].t + '</button>';
    h += '</td>';
  }
  h += '</tr></table>';
  return h;
}

function actionsHtml(){
  var bh = Math.round(M.actionH * 0.84);
  return '<div style="width:' + M.padW + 'px;margin:0 auto">' + gridRow(M.padW, [
    {t:"提交", call:"submitGuess()"},
    {t:"删除", call:"delLetter()"},
    {t:"字母表", call:"openAlpha()"}
  ], bh, M.gap, "btn") + '</div>';
}

/* ---------- 设置页 ---------- */

function showSetup(fromGame){
  setupFrom = (fromGame && game && (game.phase == "play" || game.phase == "bonus")) ? "mid" : "pre";
  screen = "setup";
  renderSetup();
}

function optTable(items, cols, key, width){
  var bh = Math.round(clamp(M.H * 0.066, 50, 64));
  var i, cur, list = [];
  for (i = 0; i < items.length; i++){
    cur = cfg[key];
    list.push({
      t:items[i].t,
      call:"setOpt(&quot;" + key + "&quot;," + (typeof items[i].v == "string" ? "'" + items[i].v + "'" : items[i].v) + ')',
      on:(cur == items[i].v)
    });
  }
  return gridRow(width || Math.min(M.appW, 900), list, bh, M.gap, "opt");
}

function sectionHtml(label, inner, note){
  var h = '<div style="margin-top:' + Math.round(M.H * 0.014) + 'px">';
  h += '<div style="font-size:' + Math.round(clamp(M.H * 0.022, 15, 18)) + 'px;font-weight:bold;margin-bottom:4px">' + label + '</div>';
  h += inner;
  if (note) { h += '<div class="note" style="font-size:13px;margin-top:2px">' + note + '</div>'; }
  h += '</div>';
  return h;
}

function triesSec(w){
  return sectionHtml("每局猜词次数", optTable([{v:4,t:"4 次"},{v:5,t:"5 次"},{v:6,t:"6 次"},{v:7,t:"7 次"},{v:8,t:"8 次"}], 5, "tries", w),
    "次数越多越轻松；用完后还可追加 1 次机会（每局最多 1 次）。");
}
function lenSec(w){
  return sectionHtml("单词长度", optTable([{v:5,t:"5 字母"},{v:6,t:"6 字母"}], 2, "len", w),
    "5 字母和 6 字母各有一套词库，与次数自由组合。");
}
function levelSec(w){
  return sectionHtml("词库档位", optTable([{v:"e",t:"简单档 · 高中"},{v:"h",t:"难档 · 进阶"}], 2, "level", w),
    "简单档为高中常见词；难档为四六级、托福及更生僻的词。");
}
function filterSec(w){
  return sectionHtml("词形过滤", optTable([{v:1,t:"仅原型"},{v:0,t:"含变形词"}], 2, "filter", w),
    "“仅原型”排除 asked、going、broken 这类变形词，只留原形。");
}

function startBlockHtml(w){
  var startLabel = (setupFrom == "mid") ? "返回本局" : "开始游戏";
  var startCall = (setupFrom == "mid") ? "showGame()" : "startGame()";
  var bh = Math.round(clamp(M.H * 0.08, 56, 74));
  var h = '<div style="margin-top:' + Math.round(M.H * 0.018) + 'px">';
  h += '<button class="btn primary" style="width:' + (w - 4) + 'px;height:' + (bh - 4) + 'px;font-size:' + Math.round(clamp(bh * 0.3, 17, 23)) + 'px" onclick="' + startCall + '">' + startLabel + '</button>';
  if (setupFrom == "mid"){
    h += '<button class="btn ghost" style="width:' + (w - 4) + 'px;height:' + Math.round(bh * 0.75) + 'px;font-size:15px;margin-top:8px" onclick="showConfirm(&quot;newgame&quot;)">放弃本局，按新设置开新局</button>';
  }
  h += '</div>';
  return h;
}

function statsHtml(){
  return '<div class="note" style="font-size:13px;margin-top:8px">已玩 ' + cfg.played + ' 局 · 胜 ' + cfg.wins + ' 局 · 词库 ' + BANK.length + ' 词</div>';
}

function creditHtml(){
  return '<div style="margin-top:12px;padding-top:8px;border-top:1px solid #c8c8c8;text-align:center;font-size:12px;color:#666;line-height:1.7">作者 yelina123 · 仓库 <a href="https://github.com/yelina123/wordle-pro" target="_blank" rel="noopener" style="color:#222;text-decoration:underline">github.com/yelina123/wordle-pro</a></div>';
}

function legendHtml(){
  return '<div class="hr" style="margin-top:10px;padding-top:8px">'
    + '<div style="font-size:12px;color:#444;line-height:1.5">黑底：字母和位置都对；灰底：字母在答案里但位置不对；浅灰：答案里没有。游戏内点“字母表”可看 26 个字母的使用情况。</div>'
    + '</div>';
}

function renderSetup(){
  baseMetrics();
  var w = Math.min(M.appW, 900);
  var two = (M.W > M.H * 1.2 && M.H < 560);
  var html = topbar("setup");
  html += '<div style="width:' + w + 'px;margin:0 auto;padding-bottom:' + Math.round(M.H * 0.02) + 'px">';
  html += '<div style="font-size:' + Math.round(clamp(M.H * 0.036, 22, 30)) + 'px;font-weight:bold;margin-top:' + M.gap + 'px">' + (setupFrom == "mid" ? "设置" : "开始一局") + '</div>';

  if (setupFrom == "mid"){
    html += '<div class="panel" style="padding:10px;margin-top:10px">'
      + '<div style="font-weight:bold;font-size:16px">本局进行中：' + game.len + ' 字母 · 第 ' + (game.rows.length + 1) + '/' + game.maxTries + ' 次</div>'
      + '<div class="note" style="font-size:13px;margin-top:4px">下面的改动只影响下一局；点“返回本局”继续当前进度，不会重新开局。</div>'
      + '</div>';
  }

  if (two){
    var colW = Math.floor((w - 2 * M.gap) / 2);
    var left = triesSec(colW) + lenSec(colW);
    var right = levelSec(colW) + filterSec(colW) + startBlockHtml(colW) + statsHtml();
    html += '<table style="width:' + w + 'px;table-layout:fixed;border-collapse:collapse;margin-top:' + M.gap + 'px"><tr>'
      + '<td style="width:' + colW + 'px;vertical-align:top">' + left + '</td>'
      + '<td style="width:' + (2 * M.gap) + 'px"></td>'

      + '</tr></table>';
  } else {
    html += triesSec(w) + lenSec(w) + levelSec(w) + filterSec(w) + startBlockHtml(w) + statsHtml() + legendHtml();
  }
  html += creditHtml();
  html += '</div>';
  $("app").innerHTML = html;

/* ---------- 游戏页 ---------- */

function showGame(){
  if (!game) { showSetup(false); return; }
  screen = "game";
  renderGame();
}

function renderGame(){
  gameMetrics(game.maxTries, game.len);
  var html = topbar("game");
  var bodyH = M.appH - M.headerH - 2;
  var board = '<div id="boardBox">' + boardHtml() + '</div>';
  var r;

  if (M.wide){
    html += '<table style="width:' + M.appW + 'px;height:' + bodyH + 'px;table-layout:fixed;border-collapse:collapse;margin:0 auto"><tr>';
    html += '<td style="width:' + M.leftW + 'px;height:' + bodyH + 'px;vertical-align:middle;text-align:center">' + board + '</td>';
    html += '<td style="width:' + M.rightW + 'px;height:' + bodyH + 'px;vertical-align:top">' + rightCol() + '</td>';
    html += '</tr></table>';
  } else if (game.phase == "play"){
    var boardArea = bodyH - M.statusH - M.actionH - M.padH;
    html += '<table style="width:' + M.appW + 'px;height:' + bodyH + 'px;table-layout:fixed;border-collapse:collapse;margin:0 auto">';
    html += '<tr><td style="height:' + M.statusH + 'px">' + statusHtml() + '</td></tr>';
    html += '<tr><td style="height:' + boardArea + 'px;vertical-align:middle;text-align:center">' + board + '</td></tr>';
    html += '<tr><td style="height:' + M.actionH + 'px">' + actionsHtml() + '</td></tr>';
    html += '<tr><td style="height:' + M.padH + 'px">' + padHtml() + '</td></tr>';
    html += '</table>';
  } else {
    var panelH = bodyH - M.statusH - M.boardH;
    html += '<table style="width:' + M.appW + 'px;height:' + bodyH + 'px;table-layout:fixed;border-collapse:collapse;margin:0 auto">';
    html += '<tr><td style="height:' + M.statusH + 'px">' + statusHtml() + '</td></tr>';
    html += '<tr><td style="height:' + M.boardH + 'px;text-align:center">' + board + '</td></tr>';
    html += '<tr><td style="height:' + panelH + 'px;vertical-align:top">' + panelHtml() + '</td></tr>';
    html += '</table>';
  }
  $("app").innerHTML = html;
  paintKeys();
}

function excludedCount(){
  var i, ch, n = 0;
  for (i = 0; i < 26; i++){
    ch = LETTERS.charAt(i);
    if (game.status[ch] == -1) { n++; }
  }
  return n;
}

function rightCol(){
  var w = M.rightW;
  var inner = w - 6 - 20;
  M.padW = inner;
  M.keyW = Math.max(18, Math.floor((inner - 11 * M.padGap) / 10));
  var h = '<table style="width:' + w + 'px;height:' + (M.appH - M.headerH - 2) + 'px;table-layout:fixed;border-collapse:collapse"><tr><td style="vertical-align:middle">';
  h += '<div class="panel" style="width:' + (w - 6) + 'px;margin:0 auto">';
  h += '<div style="padding:10px">';
  h += statusHtml();
  if (game.phase == "play"){
    h += '<div class="note" style="font-size:12px;margin:3px 0 9px">已猜 ' + game.rows.length + ' / ' + game.maxTries + ' 次 · 已排除 ' + excludedCount() + ' 个字母</div>';
    h += actionsHtml();
    h += '<div style="height:8px"></div>';
    h += padHtml();
    h += '<div class="note" style="font-size:12px;margin-top:9px;line-height:1.45">黑底＝字母和位置都对；灰底＝有此字母但位置不对；浅灰＝答案里没有。</div>';
  } else {
    h += '<div style="height:10px"></div>';
    h += resultBody(inner);
  }
  h += '</div></div></td></tr></table>';
  return h;
}

function resultBody(innerW){
  var fs1 = Math.round(clamp(M.H * 0.026, 17, 24));
  var fs2 = Math.round(clamp(M.H * 0.021, 13, 16));
  var fs3 = Math.round(clamp(M.H * 0.055, 30, 44));
  var bh = Math.round(clamp(M.actionH * 0.9, 46, 64));
  var h = "";
  if (game.phase == "bonus"){
    h += '<div style="font-size:' + fs1 + 'px;font-weight:bold">机会用完了</div>';
    h += '<div class="note" style="font-size:' + fs2 + 'px;margin-top:6px">本局已用 ' + game.maxTries + ' 次。可以追加 1 次机会（每局最多追加一次），也可以直接看答案。</div>';
    h += '<div style="margin-top:10px">' + gridRow(innerW, [
      {t:"加一次机会", call:"addBonus()", fs:18},
      {t:"查看答案", call:"viewAnswer()"}
    ], bh, M.gap, "btn") + '</div>';
  } else {
    if (game.won) { h += '<div style="font-size:' + fs1 + 'px">猜对了，用了 ' + game.rows.length + ' 次</div>'; }
    else { h += '<div style="font-size:' + fs1 + 'px">没猜中' + (game.bonusUsed ? '（已追加 1 次）' : '') + '，答案是</div>'; }
    h += '<div style="font-size:' + fs3 + 'px;font-weight:bold;letter-spacing:2px;margin:6px 0">' + game.answer.toUpperCase() + '</div>';
    h += '<div style="font-size:' + fs2 + 'px">' + game.gloss + '</div>';
    h += '<div style="margin-top:10px">' + gridRow(innerW, [
      {t:"再来一局", call:"startGame()"},
      {t:"改设置", call:"showSetup(false)"}
    ], bh, M.gap, "btn") + '</div>';
  }
  return h;
}

function panelHtml(){
  var w = (M.wide ? M.rightW : M.appW);
  var inner = w - 6 - 20;
  var h = '<div class="panel" style="width:' + (w - 6) + 'px;margin:' + M.gap + 'px auto 0 auto">';
  h += '<div style="padding:10px">' + resultBody(inner) + '</div>';
  h += '</div>';
  return h;
}

/* ---------- 字母表 ---------- */

function openAlpha(){
  if (!game) { return; }
  screen = "alpha";
  renderAlpha();
}

function closeAlpha(){
  if (!game) { showSetup(false); return; }
  screen = "game";
  renderGame();
}

function renderAlpha(){
  baseMetrics();
  var portrait = (M.appW / M.appH < 0.92);
  var cols = portrait ? 5 : 7;
  var rows = Math.ceil(26 / cols);
  var infoH = Math.round(clamp(M.H * 0.1, 58, 90));
  var cw = (M.appW - (cols + 1) * M.gap) / cols;
  var chh = (M.appH - M.headerH - infoH - (rows + 1) * M.gap) / rows;
  var cell = Math.floor(Math.min(cw, chh, 120));
  cell = Math.max(28, cell);
  var inner = cell - 2;
  var h = topbar("alpha");
  h += '<div style="width:' + M.appW + 'px;margin:0 auto;padding-top:' + M.gap + 'px;text-align:center">';
  h += '<table style="border-collapse:separate;border-spacing:' + M.gap + 'px;table-layout:fixed;margin:0 auto">';
  var r, c, i, ch, cls, left = 0, used = [];
  for (r = 0; r < rows; r++){
    h += "<tr>";
    for (c = 0; c < cols; c++){
      i = r * cols + c;
      if (i < 26){
        ch = LETTERS.charAt(i);
        var st = game.status[ch];
        cls = "acell";
        if (st == 2) { cls = "acell a2"; }
        else if (st == 1) { cls = "acell a1"; }
        else if (st == -1) { cls = "acell a0"; }
        h += '<td class="' + cls + '" style="width:' + inner + 'px;height:' + inner + 'px;line-height:' + inner + 'px;font-size:' + Math.round(cell * 0.45) + 'px">' + ch + '</td>';
      } else {
        h += '<td class="acell na" style="width:' + inner + 'px;height:' + inner + 'px"></td>';
      }
    }
    h += "</tr>";
  }
  h += "</table>";
  for (i = 0; i < 26; i++){
    ch = LETTERS.charAt(i);
    if (game.status[ch] == -1) { used.push(ch); } else { left++; }
  }
  h += '<div class="note" style="font-size:14px;margin-top:' + (M.gap * 2) + 'px">未排除字母：' + left + ' 个';
  if (used.length > 0) { h += '<br>已排除：' + used.join(" "); }
  h += '</div>';
  h += '<div class="note" style="font-size:13px;margin-top:8px;color:#444">黑底＝位置正确；灰底＝有此字母但位置不对；浅灰＝已排除；白底＝未使用。</div>';
  h += '</div>';
  $("app").innerHTML = h;
}

/* ---------- 确认页 ---------- */

function showConfirm(to){
  confirmTo = to;
  screen = "confirm";
  renderConfirm();
}

function renderConfirm(){
  baseMetrics();
  var w = Math.min(M.appW, 520);
  var bh = Math.round(clamp(M.H * 0.085, 56, 76));
  var h = topbar("none");
  h += '<div style="width:' + w + 'px;margin:0 auto;padding-top:' + Math.round(M.H * 0.06) + 'px">';
  h += '<div style="font-size:' + Math.round(clamp(M.H * 0.036, 22, 30)) + 'px;font-weight:bold">放弃本局？</div>';
  h += '<div class="note" style="font-size:15px;margin:10px 0 18px">本局已到第 ' + game.rows.length + ' / ' + game.maxTries + ' 次，放弃后进度不会保留。</div>';
  h += '<button class="btn primary" style="width:' + (w - 4) + 'px;height:' + (bh - 4) + 'px;font-size:19px;margin-bottom:10px" onclick="showGame()">继续本局</button>';
  h += '<button class="btn ghost" style="width:' + (w - 4) + 'px;height:' + (bh - 4) + 'px;font-size:17px" onclick="startGame()">放弃并开新局</button>';
  h += '</div>';
  $("app").innerHTML = h;
}

/* ---------- 游戏逻辑 ---------- */

function inRecent(w){
  var i;
  for (i = 0; i < recent.length; i++){ if (recent[i] == w) { return true; } }
  return false;
}

function pickAnswer(len){
  var pool = [], avail = [], i, k;
  for (i = 0; i < BANK.length; i++){
    if (BANK[i].lv != cfg.level) { continue; }
    if (BANK[i].w.length != len) { continue; }
    if (cfg.filter == 1 && BANK[i].fm == "i") { continue; }
    pool.push(BANK[i]);
  }
  if (pool.length === 0){ pool = BANK.slice(0); }
  for (i = 0; i < pool.length; i++){ if (!inRecent(pool[i].w)) { avail.push(pool[i]); } }
  if (avail.length < 2) { avail = pool; }
  k = Math.floor(Math.random() * avail.length);
  recent.push(avail[k].w);
  if (recent.length > 40) { recent.shift(); }
  return avail[k];
}

function startGame(){
  var rec = pickAnswer(cfg.len);
  game = {
    answer:rec.w, gloss:rec.g, level:cfg.level, len:cfg.len,
    baseTries:cfg.tries, maxTries:cfg.tries, bonusUsed:false,
    rows:[], marks:[], cur:"", phase:"play", won:false, status:{}, msg:'点字母输入'
  };
  screen = "game";
  renderGame();
}

function newGameTap(){
  if (game && (game.phase == "play" || game.phase == "bonus") && game.rows.length > 0){
    showConfirm("newgame");
    return;
  }
  startGame();
}

function setMsg(t){
  game.msg = t;
  var e = $("msg");
  if (e) { e.innerHTML = t; }
}

function tapLetter(ch){
  if (!game || game.phase != "play") { return; }
  if (game.cur.length >= game.len) { return; }
  game.cur += ch;
  paintCell(game.rows.length, game.cur.length - 1);
  setMsg("");
}

function delLetter(){
  if (!game || game.phase != "play") { return; }
  if (game.cur.length > 0){
    game.cur = game.cur.substring(0, game.cur.length - 1);
    paintCell(game.rows.length, game.cur.length);
  }
}

function paintCell(r, c){
  var e = $("c" + r + "_" + c);
  if (!e) { return; }
  e.innerHTML = (c < game.cur.length) ? game.cur.charAt(c) : "";
  e.className = "cell on";
}

function score(g, a, n){
  var res = [], used = [], i, j;
  for (i = 0; i < n; i++){ res[i] = 0; used[i] = 0; }
  for (i = 0; i < n; i++){
    if (g.charAt(i) == a.charAt(i)){ res[i] = 2; used[i] = 1; }
  }
  for (i = 0; i < n; i++){
    if (res[i]) { continue; }
    for (j = 0; j < n; j++){
      if (!used[j] && a.charAt(j) == g.charAt(i)){ res[i] = 1; used[j] = 1; break; }
    }
  }
  return res;
}

function inDict(w){
  if (w.length == 6) { return DICT6_S.indexOf(" " + w + " ") >= 0; }
  return DICT5_S.indexOf(" " + w + " ") >= 0;
}

function submitGuess(){
  if (!game || game.phase != "play") { return; }
  if (game.cur.length < game.len){
    setMsg("还差 " + (game.len - game.cur.length) + " 个字母");
    return;
  }
  var g = game.cur, low = g.toLowerCase(), i, ch, win = true, marks;
  if (!inDict(low)){
    setMsg("词库里没有 " + g);
    return;
  }
  marks = score(low, game.answer, game.len);
  for (i = 0; i < game.len; i++){
    ch = g.charAt(i);
    if (marks[i] == 2){ game.status[ch] = 2; }
    else if (marks[i] == 1){ if (game.status[ch] != 2) { game.status[ch] = 1; } }
    else { if (game.status[ch] == null){ game.status[ch] = -1; } }
    if (marks[i] != 2) { win = false; }
  }
  game.rows.push(low);
  game.marks.push(marks);
  game.cur = "";
  setMsg("");
  $("boardBox").innerHTML = boardHtml();
  paintKeys();
  if (win){ finishAnswer(true); return; }
  if (game.rows.length >= game.maxTries){ onLose(); return; }
  var nextRow = game.rows.length;
  for (i = 0; i < game.len; i++){
    var e = $("c" + nextRow + "_" + i);
    if (e) { e.className = "cell on"; }
  }
}

function paintKeys(){
  var i, ch, el;
  for (i = 0; i < 26; i++){
    ch = LETTERS.charAt(i);
    el = $("k" + ch);
    if (el) { el.className = "key" + keyCls(ch); }
  }
}

function onLose(){
  if (!game.bonusUsed){
    game.phase = "bonus";
    game.msg = "";
    renderGame();
  } else {
    finishAnswer(false);
  }
}

function addBonus(){
  if (!game || game.phase != "bonus" || game.bonusUsed) { return; }
  game.bonusUsed = true;
  game.maxTries++;
  game.phase = "play";
  game.msg = "已追加 1 次机会";
  renderGame();
}

function viewAnswer(){
  if (!game || game.phase != "bonus") { return; }
  finishAnswer(false);
}

function finishAnswer(won){
  if (!game) { return; }
  game.phase = "answer";
  game.won = won;
  cfg.played++;
  if (won) { cfg.wins++; }
  saveCfg();
  game.msg = "";
  renderGame();
}

document.onkeydown = function(ev){
  if (screen != "game" || !game || game.phase != "play") { return; }
  var e = ev || window.event;
  var k = e.keyCode;
  var t = e.target || e.srcElement;
  if (t && t.tagName == "BUTTON" && t.blur) { t.blur(); }
  if (k == 13) { submitGuess(); }
  else if (k == 8) { delLetter(); }
  else if (k >= 65 && k <= 90) { tapLetter(String.fromCharCode(k)); }
  else { return; }
  if (e.preventDefault) { e.preventDefault(); }
  return false;
};
</script>
